---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hedge-iot-scheduler
  namespace: kube-system

---
# Explicit rather than bound to the built-in system:kube-scheduler role. The
# scheduler does less than the stock one in some ways and more in others: it
# binds pods, but it also executes the Alert Manager's solving events, which
# means creating, patching and scaling Deployments. Each rule below maps to a
# call the scheduler actually makes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hedge-iot-scheduler
rules:
# Watch pending energy-service pods, bind them, and evict them to migrate.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete", "patch"]
- apiGroups: [""]
  resources: ["pods/binding"]
  verbs: ["create"]
# Capacity and placement decisions.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Deploy, scale and migrate energy services (solving event steps).
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "update", "patch"]
# Recorded when a binding decision is made.
- apiGroups: ["", "events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hedge-iot-scheduler
subjects:
- kind: ServiceAccount
  name: hedge-iot-scheduler
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: hedge-iot-scheduler
  apiGroup: rbac.authorization.k8s.io
