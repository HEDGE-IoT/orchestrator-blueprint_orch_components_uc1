# Four mock IoT task workloads — nginx pods tagged for the hedge-iot scheduler.
#
# Each pod template carries:
#   Labels:
#     schedulingStrategy: meetup      — required for the scheduler to watch this pod
#     schedulerName (spec)            — binds it to my-scheduler
#     hedge-iot/task-type             — human-readable task class
#   Annotations (hedge-iot.eu/* prefix), in the placement model's units:
#     cycles-required — CPU demand in millicores x 1e6 (100m CPU = 100000000)
#     input-size      — input data in bytes
#     output-size     — output data in bytes
#     exe-size        — executable payload in bytes
#     deadline        — relative deadline in ms
#     ccr             — communication-to-computation ratio
#     data-source     — IoT sensor type
#   Every annotation is optional: a missing one is derived from the container's
#   resource requests, which is why each task below also declares them.

---
# Task 0 — temperature monitor (communication-dominated, relaxed deadline)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-temperature-monitor
  namespace: default
  labels:
    hedge-iot/task-type: temperature-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-temperature-monitor
  template:
    metadata:
      labels:
        app: task-temperature-monitor
        schedulingStrategy: meetup
        serviceName: temperature-monitor
        hedge-iot/task-type: temperature-monitor
      annotations:
        hedge-iot.eu/cycles-required: "100000000"
        hedge-iot.eu/input-size: "6793216"
        hedge-iot.eu/output-size: "4841472"
        hedge-iot.eu/exe-size: "33241088"
        hedge-iot.eu/deadline: "8838"
        hedge-iot.eu/ccr: "4.52"
        hedge-iot.eu/data-source: "temperature"
    spec:
      schedulerName: my-scheduler
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi

